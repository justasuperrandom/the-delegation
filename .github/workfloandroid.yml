name: Build Android APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          sed -i "s#base: '/the-delegation/'#base: './'#" vite.config.ts
          npm install
          npm i @capacitor/core@7 @capacitor/android@7
          npm i -D @capacitor/cli@7
          echo '{"appId":"net.unboring.thedelegation","appName":"The Delegation","webDir":"dist"}' > capacitor.config.json
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: the-delegation-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
